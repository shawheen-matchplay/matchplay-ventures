# Rebuild the portfolio whenever a company or the generator changes (the
# portfolio editor commits straight to main), commit the generated files, and
# ask GitHub Pages to republish. Pushes made with GITHUB_TOKEN don't trigger
# Pages on their own, hence the explicit build request.
name: Build portfolio

on:
  push:
    branches: [main]
    paths:
      - "content/portfolio/**"
      - "tools/portfolio/build.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-portfolio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the portfolio
        run: python3 tools/portfolio/build.py

      - name: Commit the generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html portfolio sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git commit -m "Portfolio: rebuild pages"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Republish GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped."
